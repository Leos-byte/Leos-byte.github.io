name: Format Blog Design
on:
  push:
    branches: [feat/blog-first-prototype-design]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/blog-first-prototype-design
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/assets/styles/leo.css src/components/blog/SinglePost.astro src/components/blog/ToBlogLink.astro
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/styles/leo.css src/components/blog
          git diff --cached --quiet || git commit -m "style: format blog design"
          git push origin HEAD:feat/blog-first-prototype-design
