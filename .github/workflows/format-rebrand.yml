name: Format LEO Rebrand
on:
  push:
    branches: [feat/full-site-rebrand-preserve-blog]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-site-rebrand-preserve-blog
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/assets/styles/leo.css src/layouts/Layout.astro src/pages/404.astro src/pages/about.astro src/pages/contact.astro src/pages/corrections.astro src/pages/safeguards.astro src/pages/services.astro src/pages/training.astro
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/styles/leo.css src/layouts/Layout.astro src/pages
          git diff --cached --quiet || git commit -m "style: format full site redesign"
          git push origin HEAD:feat/full-site-rebrand-preserve-blog
