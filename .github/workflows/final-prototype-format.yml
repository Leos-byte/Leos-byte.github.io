name: Final Prototype Formatting
on:
  push:
    branches: [feat/exact-first-prototype]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/exact-first-prototype
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/pages/index.astro src/assets/styles/leo.css src/components/widgets/Footer.astro
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro src/assets/styles/leo.css src/components/widgets/Footer.astro
          git diff --cached --quiet || git commit -m "style: finalize prototype formatting"
          git push origin HEAD:feat/exact-first-prototype
