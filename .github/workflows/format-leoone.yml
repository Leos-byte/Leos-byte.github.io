name: Format LEOONE redesign
on:
  push:
    branches: [redesign/leoone-v1-20261015]
    paths:
      - 'src/pages/index.astro'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/leoone-v1-20261015
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/pages/index.astro
      - name: Commit formatting
        run: |
          if ! git diff --quiet -- src/pages/index.astro; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/pages/index.astro
            git commit -m "style: format LEOONE homepage"
            git push
          fi
