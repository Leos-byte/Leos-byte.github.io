name: Format Blog Palette
on:
  push:
    branches: [fix/blog-green-background]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/blog-green-background
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/assets/styles/leo.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/styles/leo.css
          git diff --cached --quiet || git commit -m "style: format blog palette"
          git push origin HEAD:fix/blog-green-background
