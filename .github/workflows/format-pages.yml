name: Format LEO Pages
on:
  push:
    branches: [feat/full-site-rebrand-preserve-blog]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-site-rebrand-preserve-blog
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/pages/404.astro src/pages/about.astro src/pages/safeguards.astro src/pages/services.astro src/pages/training.astro
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages
          git diff --cached --quiet || git commit -m "style: finalize Prettier formatting"
          git push origin HEAD:feat/full-site-rebrand-preserve-blog
