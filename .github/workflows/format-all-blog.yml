name: Format Blog Reading
on:
  push:
    branches: [fix/all-blog-reading-design]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/all-blog-reading-design
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/assets/styles/leo.css src/assets/styles/tailwind.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/styles/leo.css src/assets/styles/tailwind.css
          git diff --cached --quiet || git commit -m "style: format shared article styles"
          git push origin HEAD:fix/all-blog-reading-design
