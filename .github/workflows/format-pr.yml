name: Format PR source
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/leo-cyber-ai-homepage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/pages/index.astro src/navigation.ts src/components/Logo.astro src/components/widgets/Header.astro
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro src/navigation.ts src/components/Logo.astro src/components/widgets/Header.astro
          git diff --cached --quiet || git commit -m "style: format redesigned site"
          git push origin HEAD:feat/leo-cyber-ai-homepage
